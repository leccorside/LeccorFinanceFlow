# Same values as `productionHeaders` in apps/frontend/security-headers.ts
# (nginx-headers.test.ts fails if they drift). Included in every location that sets
# headers, because nginx drops inherited add_header directives in that case.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
