# Production web server: the built SPA and the API behind one origin (no CORS needed).
# TLS terminates in front of this container (load balancer / reverse proxy of the host).

upstream leccor_api {
  server backend:3000;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Audio uploads (MAX_AUDIO_SIZE_MB, up to 25) are the largest request bodies.
  client_max_body_size 26m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API: everything under /api goes to the backend, which sends its own (stricter) headers.
  location /api/ {
    proxy_pass http://leccor_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI and voice calls can take up to AI_REQUEST_TIMEOUT_MS (max 300 s).
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_buffering off;
  }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html, which is never cached.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
